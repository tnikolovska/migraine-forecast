name: CI/CD Multi-Service App

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore backend
        run: dotnet restore backend/MigraineForecast.API/MigraineForecast.API.csproj

      - name: Build backend
        run: dotnet build backend/MigraineForecast.API/MigraineForecast.API.csproj --no-restore

      - name: Run backend tests
        run: dotnet test backend/MigraineForecastAPI.Tests/MigraineForecastAPI.Tests.csproj
        continue-on-error: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend/migraine-frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend/migraine-frontend
        run: npm run build

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/MigraineForecast.API
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/migraine-backend:latest
            ghcr.io/${{ github.repository_owner }}/migraine-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/migraine-frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/migraine-frontend:latest
            ghcr.io/${{ github.repository_owner }}/migraine-frontend:${{ github.sha }}

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Deploy to Dev
        run: |
          echo "Deploying to DEV environment..."
          echo "Pull latest backend/frontend images from GHCR"
          echo "Run docker compose on dev server"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_TOKEN }}

            mkdir -p ~/migraine-forecast
            cd ~/migraine-forecast

            cat > docker-compose.prod.yml << 'EOF'
            services:
              db:
                image: postgres:15
                environment:
                  POSTGRES_DB: migraine_db
                  POSTGRES_USER: postgres
                  POSTGRES_PASSWORD: password
                volumes:
                  - postgres_data:/var/lib/postgresql/data

              backend:
                image: ghcr.io/tnikolovska/migraine-backend:latest
                depends_on:
                  - db
                environment:
                  ASPNETCORE_ENVIRONMENT: Production
                  ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=migraine_db;Username=postgres;Password=password
                ports:
                  - "5000:8080"

              frontend:
                image: ghcr.io/tnikolovska/migraine-frontend:latest
                depends_on:
                  - backend
                ports:
                  - "80:80"

            volumes:
              postgres_data:
            EOF

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d